<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com">
<title>Avaliador de Pokémon</title>
<style>
  :root { --bg:#14101c; --card:#1e1829; --card2:#261f34; --line:#342a46; --tx:#ece8f4; --mut:#9c92b0; --acc:#a78bfa; --ok:#4ade80; --warn:#fbbf24; --err:#f87171; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font: 13px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  body { padding: 16px; max-width: 980px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .mut { color: var(--mut); } .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--err); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  textarea { width: 100%; min-height: 120px; background: var(--card2); color: var(--tx); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12px/1.4 ui-monospace, Consolas, monospace; resize: vertical; }
  input, select { background: var(--card2); color: var(--tx); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; }
  button { background: var(--card2); color: var(--tx); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.prim { background: #7c3aed; border-color: #7c3aed; color: #fff; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .linha { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .top { display: flex; gap: 12px; align-items: center; }
  .spr { width: 64px; height: 64px; border-radius: 12px; background: var(--card2); image-rendering: pixelated; object-fit: contain; }
  .nm { font-size: 17px; font-weight: 600; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; color: #c9c1da; }
  .price { margin-left: auto; text-align: right; }
  .price b { font-size: 18px; }
  .verd { border-radius: 10px; padding: 10px 12px; margin: 12px 0; border: 1px solid; }
  .verd b { font-size: 15px; }
  .verd.bom { background: #12301f; border-color: #166534; } .verd.bom b { color: var(--ok); }
  .verd.justo { background: #1f2638; border-color: #334155; } .verd.justo b { color: #93c5fd; }
  .verd.caro { background: #3a1d24; border-color: #6b2a36; } .verd.caro b { color: var(--err); }
  .verd.neutro { background: var(--card2); border-color: var(--line); } .verd.neutro b { color: var(--tx); }
  .g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .k { background: var(--card2); border-radius: 10px; padding: 9px 11px; }
  .k small { display: block; color: var(--mut); font-size: 11px; }
  .k b { font-size: 16px; }
  .bar { height: 5px; background: #2a2236; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--acc); }
  .sec { color: var(--mut); font-size: 11px; margin: 14px 0 4px; text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid #2a2236; }
  .row:last-child { border: 0; }
  .row > span:last-child { text-align: right; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #2a2236; }
  th { color: var(--mut); font-weight: 500; }
  td.n, th.n { text-align: right; }
  tr.perto td { background: #221a33; }
  .aviso { color: var(--warn); }
  .carregando { padding: 30px; text-align: center; color: var(--mut); }
  @media (max-width: 720px) { .g3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<h1>Avaliador de Pokémon</h1>
<p class="mut" style="margin:0 0 12px">Diz se um Pokémon vale o preço: força em PvE e PvP pelas fórmulas do próprio jogo, raridade do nascimento e comparação com o que vendeu nos últimos 30 dias.</p>

<div class="panel" id="entrada">
  <div id="origem" class="mut">Cole a ficha do Pokémon (botão <b>Copiar p/ ChatGPT</b> da ficha no jogo) ou clique em <b>Avaliar</b> num anúncio do Mercado.</div>
  <textarea id="ficha" spellcheck="false" placeholder="# Garchomp — ficha do PokeIdle&#10;- Espécie: Garchomp (#445)&#10;- Nível: 120&#10;- Potência: P4 ..."></textarea>
  <div class="linha">
    <label>Preço <input id="preco" type="text" inputmode="numeric" placeholder="2.400" style="width:140px"></label>
    <select id="moeda"><option value="orb">Gemas</option><option value="gold">Coins (ouro)</option></select>
    <button id="avaliar" class="prim">Avaliar</button>
    <span id="msg" class="mut"></span>
  </div>
</div>

<div id="resultado"></div>

<script src="avaliador.js"></script>
</body>
</html>
